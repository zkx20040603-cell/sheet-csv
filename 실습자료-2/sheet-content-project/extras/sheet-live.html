<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>볼 때 읽기 예제 · 구글 시트</title>
  <!--
    선택 실습: 방문자가 페이지를 열 때마다 브라우저가 시트를 직접 읽는 방식입니다.
    1) 아래 CSV_URL에 '웹에 게시'한 CSV 주소를 넣습니다.
    2) 파일을 더블클릭해 열면 브라우저가 읽기를 막을 수 있으니, 로컬 서버나 GitHub Pages에서 엽니다.
       예: 이 예제 폴더에서 python3 -m http.server 8000 → http://localhost:8000/extras/sheet-live.html
  -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f7fa; color: #182433; line-height: 1.6; }
    main { max-width: 920px; margin: 0 auto; padding: 28px 20px 40px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .lead { margin: 0 0 20px; color: #45596b; }
    .tools { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .tools > div { flex: 1 1 220px; }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    input, select { width: 100%; height: 46px; font: inherit; padding: 8px 12px; border: 1px solid #9fb3c4; border-radius: 8px; background: #fff; }
    input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    #status { color: #45596b; font-size: 15px; margin: 6px 0 16px; }
    #status.error { color: #9a3412; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px 14px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    li { background: #fff; border: 1px solid #d5e0ea; border-radius: 14px; padding: 18px; }
    li h2 { font-size: 18px; margin: 8px 0 6px; overflow-wrap: anywhere; }
    li p { margin: 0 0 8px; color: #33475b; overflow-wrap: anywhere; }
    .tag { font-size: 12px; font-weight: 700; color: #0f3552; background: #e3eef7; border-radius: 999px; padding: 2px 10px; }
    .more { color: #0b6a8a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>볼 때 읽기 예제</h1>
    <p class="lead">페이지를 열 때마다 구글 시트의 최신 내용을 읽어 옵니다.</p>
    <div class="tools">
      <div><label for="q">검색</label><input id="q" type="search" placeholder="제목·내용·분류에서 찾기" disabled></div>
      <div><label for="category">분류</label><select id="category" disabled><option value="">전체</option></select></div>
    </div>
    <p id="status" role="status" aria-live="polite">시트를 불러오는 중입니다…</p>
    <ul id="cards"></ul>
  </main>
  <script>
    // 웹에 게시한 CSV 주소로 바꿉니다. 예: https://docs.google.com/spreadsheets/d/e/.../pub?output=csv
    const CSV_URL = '../sample.csv';

    // 쉼표·따옴표·줄바꿈이 들어간 칸도 읽는 CSV 해석기
    function parseCSV(text) {
      const rows = []; let row = []; let field = ''; let inQuotes = false;
      text = text.replace(/^﻿/, '');
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') { inQuotes = false; }
          else { field += ch; }
        } else if (ch === '"') { inQuotes = true; }
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (ch !== '\r') { field += ch; }
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    function toItems(rows) {
      const header = rows[0].map(name => name.trim());
      const index = name => header.indexOf(name);
      for (const name of ['제목', '내용', '공개']) {
        if (index(name) === -1) throw new Error(`필수 열 '${name}'이 없습니다. 현재 열: ${header.join(', ')}`);
      }
      return rows.slice(1)
        .map(r => ({ title: (r[index('제목')] || '').trim(), body: (r[index('내용')] || '').trim(),
          category: (index('분류') >= 0 && r[index('분류')] || '').trim() || '기타',
          link: (index('링크') >= 0 && r[index('링크')] || '').trim(),
          public: (r[index('공개')] || '').trim().toUpperCase() }))
        .filter(item => ['Y', 'YES', '예', 'O'].includes(item.public) && item.title && item.body);
    }

    function render(items) {
      const list = document.getElementById('cards');
      const q = document.getElementById('q');
      const category = document.getElementById('category');
      for (const c of [...new Set(items.map(i => i.category))].sort()) category.add(new Option(c, c));
      q.disabled = category.disabled = false;
      const apply = () => {
        const word = q.value.trim().toLowerCase();
        const shown = items.filter(i => (!word || `${i.title} ${i.body} ${i.category}`.toLowerCase().includes(word))
          && (!category.value || i.category === category.value));
        list.replaceChildren(...shown.map(i => {
          const li = document.createElement('li');
          const tag = Object.assign(document.createElement('span'), { className: 'tag', textContent: i.category });
          const h2 = Object.assign(document.createElement('h2'), { textContent: i.title });
          const p = Object.assign(document.createElement('p'), { textContent: i.body });
          li.append(tag, h2, p);
          if (/^https?:\/\//.test(i.link)) {
            li.append(Object.assign(document.createElement('a'), { className: 'more', href: i.link, textContent: '자세히 보기', rel: 'noopener' }));
          }
          return li;
        }));
        document.getElementById('status').textContent = shown.length
          ? `전체 ${items.length}개 중 ${shown.length}개`
          : '조건에 맞는 항목이 없습니다. 검색어를 줄이거나 분류를 ‘전체’로 바꿔 보세요.';
      };
      q.addEventListener('input', apply);
      category.addEventListener('change', apply);
      apply();
    }

    fetch(CSV_URL, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`시트 주소에서 ${response.status} 응답을 받았습니다.`);
        return response.text();
      })
      .then(text => {
        if (/^\s*<(!doctype html|html)/i.test(text)) throw new Error('CSV 대신 웹페이지가 왔습니다. 웹에 게시한 CSV 주소인지 확인하세요.');
        const items = toItems(parseCSV(text));
        if (!items.length) throw new Error('공개 열이 Y인 행이 없습니다.');
        render(items);
      })
      .catch(error => {
        const status = document.getElementById('status');
        status.className = 'error';
        status.textContent = `시트를 불러오지 못했습니다. ${error.message}`;
      });
  </script>
</body>
</html>
